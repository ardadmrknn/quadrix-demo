name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce numpy Pillow pytest requests

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: 1
        run: >-
          python -m pytest -q --tb=short
          --ignore=tests/test_flexible_border_feature.py
          --ignore=tests/test_flexible_border_ingame.py
          --ignore=tests/test_flexible_border_integration.py
          --ignore=tests/test_ingame_esc_opens_pause_menu.py
          --ignore=tests/test_lb_write.py
          --ignore=tests/test_lb_write_proxy.py
          --ignore=tests/test_user_manager_steam_profile.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ --select=E,F,W --ignore=E501,E402,F841,W605 --exit-zero
