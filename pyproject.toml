[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrix"
version = "1.0.26"
description = "Pygame-based Tetris game with Steam integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Burak Yasayan"},
]

dependencies = [
    "pygame-ce>=2.5.7",
    "numpy>=1.26.4",
    "Pillow>=12.2.0",
    "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.11",
]
build = [
    "pyinstaller>=6.16",
    "pyinstaller-hooks-contrib>=2026.4",
]
macos = [
    # "pyobjc-framework-Cocoa",  # macOS pencere focus yönetimi (opsiyonel)
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "quadrix_feedback: feedback-fixes acceptance and regression tests",
    "quadrix_phase0: phase 0 measurement and baseline tests",
    "quadrix_phase1: phase 1 piece geometry tests",
    "quadrix_phase2: phase 2 scoring tests",
    "quadrix_phase3: phase 3 game-flow tests",
    "quadrix_phase4: phase 4 randomizer tests",
    "quadrix_phase5: phase 5 HUD and navigation tests",
    "quadrix_phase6: phase 6 mode and localization tests",
    "quadrix_phase6b: phase 6b balance and hardening tests",
    "quadrix_phase7: phase 7 campaign scan tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — mevcut kodda çok fazla uzun satır var
    "E402",  # module level import not at top — çok kullanılıyor
    "F841",  # local variable assigned but never used
    "W605",  # invalid escape sequence
]
